# Base de datos en memoria: cada ejecucion de tests arranca limpia.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=secreto-de-pruebas-con-mas-de-32-caracteres-ok
app.jwt.expiration-seconds=900
app.jwt.refresh-expiration-seconds=2592000

# Carpeta aparte para no mezclar con las subidas de desarrollo.
app.storage.upload-dir=./target/test-uploads
app.storage.public-base-url=http://localhost:8080

app.security.login.max-attempts=5
app.security.login.window-seconds=900

app.google.client-id=test-client-id
app.google.client-secret=test-client-secret
app.google.redirect-uri=
