spring.application.name=backend

# ---------------------------------------------------------------------------
# Base de datos
# ---------------------------------------------------------------------------
# H2 en archivo: no hay que instalar nada y los datos sobreviven al reinicio.
# Para produccion se cambia por PostgreSQL ajustando estas cuatro lineas.
spring.datasource.url=jdbc:h2:file:./data/appdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# update crea y ajusta las tablas solas mientras desarrollamos.
# En produccion esto debe ser "validate" y los cambios de esquema ir por Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
# El secreto real va por variable de entorno, NUNCA commiteado.
# El valor tras ":" es solo para desarrollo local.
app.jwt.secret=${JWT_SECRET:dev-secret-cambiar-en-produccion-min-32-chars}
# Access token corto: si lo roban, la ventana de abuso es de 15 minutos.
app.jwt.expiration-seconds=900
# Refresh token: 30 dias. Es revocable, por eso puede durar mucho mas.
app.jwt.refresh-expiration-seconds=2592000

# ---------------------------------------------------------------------------
# Limite de intentos de login (por correo + IP)
# ---------------------------------------------------------------------------
app.security.login.max-attempts=5
app.security.login.window-seconds=900

# ---------------------------------------------------------------------------
# Subida de imagenes
# ---------------------------------------------------------------------------
app.storage.upload-dir=./uploads
app.storage.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
