spring.application.name=backend

# ---------------------------------------------------------------------------
# Base de datos
# ---------------------------------------------------------------------------
# H2 en archivo: no hay que instalar nada y los datos sobreviven al reinicio.
# Para produccion se cambia por PostgreSQL ajustando estas cuatro lineas.
spring.datasource.url=jdbc:h2:file:./data/appdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# update crea y ajusta las tablas solas mientras desarrollamos.
# En produccion esto debe ser "validate" y los cambios de esquema ir por Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
# El secreto real va por variable de entorno, NUNCA commiteado.
# El valor tras ":" es solo para desarrollo local.
app.jwt.secret=${JWT_SECRET:dev-secret-cambiar-en-produccion-min-32-chars}
# Access token corto: si lo roban, la ventana de abuso es de 15 minutos.
app.jwt.expiration-seconds=900
# Refresh token: 30 dias. Es revocable, por eso puede durar mucho mas.
app.jwt.refresh-expiration-seconds=2592000

# ---------------------------------------------------------------------------
# Limite de intentos de login (por correo + IP)
# ---------------------------------------------------------------------------
app.security.login.max-attempts=5
app.security.login.window-seconds=900

# ---------------------------------------------------------------------------
# Subida de imagenes
# ---------------------------------------------------------------------------
app.storage.upload-dir=./uploads
app.storage.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------------------------------------------------------------------------
# Horarios
# ---------------------------------------------------------------------------
# Zona usada para "el dia" cuando el cliente no manda ?tz=
app.schedule.default-timezone=America/Bogota
# Ventana en la que se buscan huecos libres
app.schedule.day-start=06:00
app.schedule.day-end=22:00

# ---------------------------------------------------------------------------
# Google Calendar
# ---------------------------------------------------------------------------
# Todo por variable de entorno, NUNCA commiteado. Sin esto, /sync/google responde 503
# y el resto de la app funciona igual.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# Solo para flujo web. Los codigos de apps nativas (Android, Flutter) no lo usan.
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
# 32 bytes en Base64. Cifra los refresh tokens guardados; si se pierde o cambia,
# los usuarios tienen que conectar Google de nuevo.
app.google.token-encryption-key=${TOKEN_ENCRYPTION_KEY:}
# Ventana de eventos que se descarga de Google
app.schedule.google-past-days=30
app.schedule.google-future-days=180

# ---------------------------------------------------------------------------
# Analytics (envio de eventos al engine)
# ---------------------------------------------------------------------------
app.analytics.enabled=${ANALYTICS_ENABLED:true}
app.analytics.url=${ANALYTICS_URL:http://localhost:8000}
app.analytics.ingest-key=${ANALYTICS_INGEST_KEY:}
