# No hay javax.cache en el proyecto: usar un mapa en memoria para las zonas horarias.
net.fortuna.ical4j.timezone.cache.impl=net.fortuna.ical4j.util.MapTimeZoneCache
# No intentar descargar actualizaciones de zonas horarias por red.
net.fortuna.ical4j.timezone.update.enabled=false
# Los .ics reales (Outlook, universidades) suelen incumplir el estandar en detalles.
ical4j.parsing.relaxed=true
ical4j.unfolding.relaxed=true
ical4j.validation.relaxed=true